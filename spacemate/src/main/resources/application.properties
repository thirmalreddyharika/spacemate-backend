spring.application.name=spacemate

# ===============================
# DATABASE
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spacemate?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jackson.serialization.fail-on-empty-beans=false


# ===============================
# SERVER
# ===============================

server.port=${PORT:8080}

# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET:SpaceMateLocalDevKeyChangeMe2026VeryLongKeyForTesting}

jwt.expiration=86400000

# ===============================
# CORS
# ===============================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}